<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ljhiokc 的主页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const key = "personal-portal-theme-v1";
        const saved = localStorage.getItem(key);
        if (saved) {
          document.documentElement.dataset.theme = saved;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span id="site-title">ljhiokc 的主页</span>
      </div>
      <details id="display-settings" class="display-settings">
        <summary class="theme-toggle">显示设置</summary>
        <div class="display-options">
          <time id="live-clock" class="clock-pill"></time>
          <button id="theme-toggle-btn" class="theme-toggle" type="button" aria-label="切换主题"></button>
        </div>
      </details>
    </header>

    <main class="container">
      <section class="hero">
        <h1 id="hero-title">常用入口，一页速达</h1>
        <p id="hero-desc">把日常网站与工具收进一个面板，搜索、分类、拖拽排序都更顺手。</p>
        <div class="web-search-group" role="search" aria-label="网页搜索">
          <label class="engine-picker" for="web-search-engine">
            <img
              id="web-search-engine-icon"
              class="engine-icon"
              src="./assets/icons/search-engines/google.png"
              alt=""
              aria-hidden="true"
            />
            <select id="web-search-engine" class="search-engine-select" aria-label="选择搜索引擎">
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="baidu">百度</option>
              <option value="duckduckgo">DuckDuckGo</option>
            </select>
            <span class="engine-caret" aria-hidden="true">▾</span>
          </label>
          <input
            id="web-search-input"
            class="search-input"
            type="search"
            aria-label="网页搜索关键词"
            placeholder="搜索网页"
            autocomplete="off"
          />
          <button id="web-search-btn" class="btn btn-primary" type="button">搜索</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="links-heading">
        <div class="panel-head">
          <div class="links-heading">
            <h2 id="links-heading">快速访问</h2>
            <span id="link-count" role="status"></span>
          </div>
          <button id="manage-btn" class="btn" type="button" aria-expanded="false" aria-controls="manage-controls">管理链接</button>
        </div>
        <div id="manage-controls" hidden>
          <div class="manage-actions">
            <button id="add-link-btn" class="btn btn-primary" type="button">新增链接</button>
            <button id="export-btn" class="btn" type="button">导出配置</button>
            <button id="import-btn" class="btn" type="button">导入配置</button>
            <button id="reset-btn" class="btn btn-danger" type="button">恢复默认</button>
            <input id="import-file-input" type="file" accept=".json,application/json" hidden />
          </div>
          <p class="hint">用箭头<span class="drag-hint">或拖拽</span>调整链接顺序。</p>
        </div>
        <div class="link-filters">
          <input
            id="search-input"
            class="search-input"
            type="search"
            aria-label="筛选快捷链接"
            aria-keyshortcuts="/"
            placeholder="筛选链接"
            autocomplete="off"
          />
          <div id="category-chips" class="chips" role="group" aria-label="链接分类"></div>
        </div>
        <div id="links-grid" class="links-grid"></div>
        <p class="hint keyboard-hint">快捷键：<kbd>/</kbd> 筛选链接，<kbd>1</kbd>–<kbd>9</kbd> 打开当前列表的前 9 个链接</p>
      </section>
    </main>

    <dialog id="link-dialog" class="link-dialog" aria-labelledby="dialog-title">
      <form id="link-form" method="dialog">
        <h3 id="dialog-title">新增链接</h3>
        <input id="link-id" type="hidden" />

        <label>
          名称
          <input id="link-name" type="text" required maxlength="40" />
        </label>
        <label>
          URL
          <input id="link-url" type="url" required placeholder="https://example.com" />
        </label>
        <label>
          分类
          <input id="link-category" type="text" required maxlength="20" placeholder="工具 / 学习 / 社交..." />
        </label>
        <label>
          图标（emoji 或图片 URL/路径，可选）
          <input id="link-icon" type="text" maxlength="200" placeholder="🚀 或 ./assets/icons/links/github.png" />
        </label>

        <menu>
          <button type="button" id="cancel-dialog-btn" class="btn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </menu>
      </form>
    </dialog>

    <template id="link-card-template">
      <article class="link-card">
        <a class="link-main" target="_blank" rel="noreferrer noopener">
          <span class="link-icon" aria-hidden="true"></span>
          <span class="link-meta">
            <strong class="link-name"></strong>
            <small class="link-category"></small>
          </span>
          <span class="link-index" aria-hidden="true"></span>
        </a>
        <div class="link-actions" hidden>
          <button type="button" class="icon-btn move-up-btn" title="上移">↑</button>
          <button type="button" class="icon-btn move-down-btn" title="下移">↓</button>
          <button type="button" class="icon-btn edit-btn">编辑</button>
          <button type="button" class="icon-btn delete-btn">删除</button>
        </div>
      </article>
    </template>

    <script src="./theme.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
